[profile.default]
src = "src"
test = "test"
script = "script"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
allow_paths = ["../node_modules"]
remappings = ["forge-std/=vendor/forge-std/src/", "@1inch/swap-vm/=vendor/swap-vm/", "@1inch/aqua/=vendor/aqua/", "@1inch/solidity-utils/=../node_modules/@1inch/solidity-utils/", "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]

[fmt]
line_length = 100
